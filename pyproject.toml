[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "n8n-lint"
version = "1.0.0"
description = "Stdlib-only static linter and redactor for n8n workflow JSON files."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
n8n-lint = "n8n_lint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
