name: n8n-lint
description: Scan exported n8n workflows
inputs:
  path:
    description: Workflow file or directory to scan
    required: true
runs:
  using: composite
  steps:
    - name: Install n8n-lint
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - name: Scan workflows
      shell: bash
      env:
        N8N_LINT_PATH: ${{ inputs.path }}
      run: n8n-lint scan "$N8N_LINT_PATH" --no-color
